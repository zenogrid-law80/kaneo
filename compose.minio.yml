# Use --env-file .env --env-file .env.minio.local to preserve existing Kaneo settings.
services:
  kaneo:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio.localhost:9000}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.minio.local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.minio.local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.minio.local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: kaneo-minio:local-2025-10-15
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.minio.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.minio.local}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      default:
        aliases:
          - minio.localhost
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio-init:
    image: kaneo-minio-client:local-2025-08-13
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: client
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.minio.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.minio.local}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.minio.local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.minio.local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.minio.local}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./scripts/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  minio_data:
